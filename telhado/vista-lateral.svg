<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Vista lateral  telhado de duas águas</title>
  <desc id="desc">Elevação lateral de um telhado de duas águas com cotas e legendas em português de Portugal.</desc>

  <defs>
    <pattern id="telha" patternUnits="userSpaceOnUse" width="18" height="10" patternTransform="rotate(-28)">
      <path d="M0 8 Q4.5 2 9 8 Q13.5 2 18 8" fill="none" stroke="#b85c38" stroke-width="1.1"/>
    </pattern>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2a2a2a"/>
    </marker>
    <style>
      .parede { fill: #f2eee6; stroke: #2a2a2a; stroke-width: 2; }
      .cobertura { fill: url(#telha); stroke: #2a2a2a; stroke-width: 2.2; }
      .estrutura { fill: none; stroke: #6b5344; stroke-width: 2; }
      .cota { fill: none; stroke: #2a2a2a; stroke-width: 1.2; }
      .cota-fina { fill: none; stroke: #2a2a2a; stroke-width: 1; }
      .texto { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; fill: #1f1f1f; }
      .titulo { font-size: 22px; font-weight: 700; }
      .rotulo { font-size: 13px; }
      .nota { font-size: 12px; fill: #444; }
      .fundo { fill: #faf8f4; }
    </style>
  </defs>

  <rect class="fundo" x="0" y="0" width="900" height="620"/>

  <!-- Título -->
  <text class="texto titulo" x="40" y="42">Vista lateral  telhado de duas águas</text>
  <text class="texto nota" x="40" y="64">Elevação do frontão · proposta base (valores ilustrativos)</text>

  <!-- Solo -->
  <line class="cota" x1="80" y1="520" x2="820" y2="520"/>
  <path d="M80 520 L90 530 M100 520 L110 530 M120 520 L130 530 M140 520 L150 530 M160 520 L170 530 M180 520 L190 530 M200 520 L210 530 M220 520 L230 530 M240 520 L250 530 M260 520 L270 530 M280 520 L290 530 M300 520 L310 530 M320 520 L330 530 M340 520 L350 530 M360 520 L370 530 M380 520 L390 530 M400 520 L410 530 M420 520 L430 530 M440 520 L450 530 M460 520 L470 530 M480 520 L490 530 M500 520 L510 530 M520 520 L530 530 M540 520 L550 530 M560 520 L570 530 M580 520 L590 530 M600 520 L610 530 M620 520 L630 530 M640 520 L650 530 M660 520 L670 530 M680 520 L690 530 M700 520 L710 530 M720 520 L730 530 M740 520 L750 530 M760 520 L770 530 M780 520 L790 530 M800 520 L810 530" stroke="#bbb" stroke-width="1"/>

  <!-- Parede -->
  <rect class="parede" x="250" y="300" width="400" height="220"/>

  <!-- Cobertura (triângulo do telhado + beirados) -->
  <polygon class="cobertura" points="200,300 450,120 700,300"/>

  <!-- Linha da cumeeira / estrutura sugerida -->
  <line class="estrutura" x1="450" y1="120" x2="450" y2="300"/>
  <line class="estrutura" x1="250" y1="300" x2="450" y2="160"/>
  <line class="estrutura" x1="700" y1="300" x2="450" y2="160"/>
  <line class="estrutura" x1="200" y1="300" x2="250" y2="300"/>
  <line class="estrutura" x1="700" y1="300" x2="650" y2="300"/>

  <!-- Rótulos do telhado -->
  <text class="texto rotulo" x="458" y="115">Cumeeira</text>
  <text class="texto rotulo" x="150" y="285">Beirado</text>
  <text class="texto rotulo" x="710" y="285">Beirado</text>
  <text class="texto rotulo" x="320" y="210">Telha</text>
  <text class="texto rotulo" x="540" y="210">Telha</text>
  <text class="texto rotulo" x="430" y="410">Parede</text>

  <!-- Inclinação -->
  <path class="cota-fina" d="M520 250 A40 40 0 0 1 555 280"/>
  <text class="texto rotulo" x="560" y="255">± H 30°</text>
  <text class="texto nota" x="560" y="272">Pendente</text>

  <!-- Cota largura total (parede) -->
  <line class="cota" x1="250" y1="545" x2="650" y2="545"/>
  <line class="cota-fina" x1="250" y1="535" x2="250" y2="555"/>
  <line class="cota-fina" x1="650" y1="535" x2="650" y2="555"/>
  <text class="texto rotulo" x="400" y="565">Largura H 8,00 m</text>

  <!-- Cota beirado esquerdo -->
  <line class="cota" x1="200" y1="545" x2="250" y2="545"/>
  <line class="cota-fina" x1="200" y1="535" x2="200" y2="555"/>
  <text class="texto rotulo" x="198" y="580">0,50 m</text>

  <!-- Cota beirado direito -->
  <line class="cota" x1="650" y1="545" x2="700" y2="545"/>
  <line class="cota-fina" x1="700" y1="535" x2="700" y2="555"/>
  <text class="texto rotulo" x="648" y="580">0,50 m</text>

  <!-- Cota altura da parede -->
  <line class="cota" x1="170" y1="300" x2="170" y2="520"/>
  <line class="cota-fina" x1="160" y1="300" x2="180" y2="300"/>
  <line class="cota-fina" x1="160" y1="520" x2="180" y2="520"/>
  <text class="texto rotulo" transform="translate(145 430) rotate(-90)">Altura parede H 2,70 m</text>

  <!-- Cota altura do telhado -->
  <line class="cota" x1="740" y1="120" x2="740" y2="300"/>
  <line class="cota-fina" x1="730" y1="120" x2="750" y2="120"/>
  <line class="cota-fina" x1="730" y1="300" x2="750" y2="300"/>
  <text class="texto rotulo" transform="translate(770 250) rotate(-90)">Altura telhado H 2,30 m</text>

  <!-- Legenda -->
  <rect x="40" y="90" width="14" height="14" fill="url(#telha)" stroke="#2a2a2a"/>
  <text class="texto nota" x="62" y="102">Cobertura em telha</text>
  <rect x="40" y="112" width="14" height="14" fill="#f2eee6" stroke="#2a2a2a"/>
  <text class="texto nota" x="62" y="124">Alvenaria / parede</text>
  <line x1="40" y1="144" x2="54" y2="144" stroke="#6b5344" stroke-width="2"/>
  <text class="texto nota" x="62" y="148">Estrutura (asnas / madres)</text>

  <text class="texto nota" x="40" y="600">Nota: cotas ilustrativas  ajustar à medida real da obra.</text>
</svg>
