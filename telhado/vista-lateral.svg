<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Corte transversal do telhado ? 6,35 m</title>
  <desc id="desc">Vista lateral / corte transversal do telhado de duas ?guas. Largura 6,35 m, paredes 0,30 m, cume a 1,80 m acima do beiral.</desc>

  <defs>
    <pattern id="telha" patternUnits="userSpaceOnUse" width="16" height="9" patternTransform="rotate(-29.55)">
      <path d="M0 7 Q4 1.5 8 7 Q12 1.5 16 7" fill="none" stroke="#a65332" stroke-width="1"/>
    </pattern>
    <pattern id="canico" patternUnits="userSpaceOnUse" width="4" height="8">
      <line x1="1" y1="0" x2="1" y2="8" stroke="#c4a574" stroke-width="1.2"/>
    </pattern>
    <pattern id="alvenaria" patternUnits="userSpaceOnUse" width="12" height="8">
      <rect width="12" height="8" fill="#f3eee4"/>
      <path d="M0 8 H12 M6 0 V8" stroke="#d8cfc0" stroke-width="0.8"/>
    </pattern>
    <style>
      .fundo { fill: #faf7f1; }
      .texto { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; fill: #1a1a1a; }
      .titulo { font-size: 22px; font-weight: 700; }
      .subtitulo { font-size: 13px; fill: #555; }
      .rotulo { font-size: 13px; }
      .rotulo-p { font-size: 11.5px; fill: #333; }
      .nota { font-size: 12px; fill: #555; }
      .cota { stroke: #222; stroke-width: 1.15; fill: none; }
      .cota-fina { stroke: #222; stroke-width: 0.9; fill: none; }
      .linha-obra { stroke: #222; stroke-width: 2; fill: none; }
      .estrutura { stroke: #6b4a2e; stroke-width: 3; fill: #8a6240; }
      .estrutura-fina { stroke: #6b4a2e; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect class="fundo" width="980" height="720"/>

  <!-- Cabe?alho -->
  <text class="texto titulo" x="36" y="40">Corte transversal do telhado (vista lateral)</text>
  <text class="texto subtitulo" x="36" y="62">Casa 12,00 ? 6,35 m ? paredes 0,30 m ? cume a 1,80 m acima do beiral</text>

  <!--
    Escala: 1 m = 80 px
    Origem do desenho (canto exterior esquerdo do beiral / topo parede exterior): x=160, y=360
    Largura exterior = 6.35 * 80 = 508
    Parede = 0.30 * 80 = 24
    Altura cume = 1.80 * 80 = 144
    Centro = 160 + 254 = 414
    Cume y = 360 - 144 = 216
  -->

  <!-- Solo / refer?ncia -->
  <line class="cota-fina" x1="100" y1="560" x2="780" y2="560" stroke="#bbb"/>

  <!-- Paredes (parcialmente abaixo do beiral para contexto) -->
  <rect x="160" y="360" width="24" height="200" fill="url(#alvenaria)" stroke="#222" stroke-width="1.8"/>
  <rect x="644" y="360" width="24" height="200" fill="url(#alvenaria)" stroke="#222" stroke-width="1.8"/>

  <!-- Face interior das paredes -->
  <line class="linha-obra" x1="184" y1="360" x2="184" y2="560"/>
  <line class="linha-obra" x1="644" y1="360" x2="644" y2="560"/>

  <!-- Linha do soalho / forro do s?t?o (n?vel do beiral) -->
  <line class="estrutura-fina" x1="184" y1="360" x2="644" y2="360" stroke-dasharray="6 4"/>

  <!-- Barrotes do forro (esquem?ticos) -->
  <g stroke="#8a6240" stroke-width="2.5">
    <line x1="220" y1="360" x2="220" y2="372"/>
    <line x1="270" y1="360" x2="270" y2="372"/>
    <line x1="320" y1="360" x2="320" y2="372"/>
    <line x1="370" y1="360" x2="370" y2="372"/>
    <line x1="414" y1="360" x2="414" y2="372"/>
    <line x1="458" y1="360" x2="458" y2="372"/>
    <line x1="508" y1="360" x2="508" y2="372"/>
    <line x1="558" y1="360" x2="558" y2="372"/>
    <line x1="608" y1="360" x2="608" y2="372"/>
  </g>

  <!-- Cobertura esquerda: camada telha + cani?o -->
  <!-- Plano esquerdo: de (148, 368) beiral exterior com pequeno voo at? cume (414, 216) -->
  <!-- Beiral com voo ~0,25 m = 20 px -->
  <polygon points="140,372 160,360 414,216 414,230 184,368" fill="url(#canico)" stroke="none"/>
  <polygon points="140,372 414,216 414,204 132,368" fill="url(#telha)" stroke="#222" stroke-width="1.6"/>

  <!-- Cobertura direita -->
  <polygon points="688,372 668,360 414,216 414,230 644,368" fill="url(#canico)" stroke="none"/>
  <polygon points="688,372 414,216 414,204 696,368" fill="url(#telha)" stroke="#222" stroke-width="1.6"/>

  <!-- Contorno exterior da cobertura -->
  <polyline class="linha-obra" points="140,372 414,216 688,372"/>

  <!-- Caibros (rafters) esquem?ticos -->
  <g class="estrutura-fina" stroke-width="2.2">
    <line x1="414" y1="222" x2="175" y2="362"/>
    <line x1="414" y1="222" x2="250" y2="330"/>
    <line x1="414" y1="222" x2="330" y2="275"/>
    <line x1="414" y1="222" x2="653" y2="362"/>
    <line x1="414" y1="222" x2="578" y2="330"/>
    <line x1="414" y1="222" x2="498" y2="275"/>
  </g>

  <!-- Cumeeira -->
  <rect class="estrutura" x="402" y="208" width="24" height="18" rx="1"/>

  <!-- Pontalete central -->
  <rect class="estrutura" x="408" y="226" width="12" height="134"/>

  <!-- Madre / apoio interm?dio -->
  <rect class="estrutura" x="300" y="300" width="228" height="10" rx="1"/>

  <!-- R?tulos estrutura -->
  <text class="texto rotulo" x="430" y="200">Cumeeira</text>
  <text class="texto rotulo-p" x="426" y="290">Pontalete</text>
  <text class="texto rotulo-p" x="250" y="295">Caibros</text>
  <text class="texto rotulo-p" x="300" y="250">Cani?o + telha</text>
  <text class="texto rotulo-p" x="120" y="350">Beiral</text>
  <text class="texto rotulo-p" x="700" y="350">Beiral</text>
  <text class="texto rotulo-p" x="100" y="450">Parede</text>
  <text class="texto rotulo-p" x="100" y="466">0,30 m</text>
  <text class="texto rotulo-p" x="668" y="450">Parede</text>
  <text class="texto rotulo-p" x="668" y="466">0,30 m</text>

  <!-- ?ngulo / pendente -->
  <path class="cota-fina" d="M470 250 A36 36 0 0 1 498 278"/>
  <text class="texto rotulo" x="505" y="262">? ? 29,6?</text>
  <text class="texto rotulo-p" x="505" y="278">Pendente</text>

  <!-- ========== COTAS ========== -->

  <!-- Largura exterior 6,35 m -->
  <line class="cota" x1="160" y1="590" x2="668" y2="590"/>
  <line class="cota-fina" x1="160" y1="580" x2="160" y2="600"/>
  <line class="cota-fina" x1="668" y1="580" x2="668" y2="600"/>
  <text class="texto rotulo" x="360" y="612">Largura exterior = 6,35 m</text>

  <!-- V?o interior -->
  <line class="cota" x1="184" y1="620" x2="644" y2="620"/>
  <line class="cota-fina" x1="184" y1="610" x2="184" y2="630"/>
  <line class="cota-fina" x1="644" y1="610" x2="644" y2="630"/>
  <text class="texto rotulo-p" x="360" y="642">V?o interior = 5,75 m</text>

  <!-- Espessura parede esquerda -->
  <line class="cota" x1="160" y1="545" x2="184" y2="545"/>
  <line class="cota-fina" x1="160" y1="538" x2="160" y2="552"/>
  <line class="cota-fina" x1="184" y1="538" x2="184" y2="552"/>
  <text class="texto rotulo-p" x="155" y="535">0,30</text>

  <!-- Altura cume 1,80 m -->
  <line class="cota" x1="740" y1="216" x2="740" y2="360"/>
  <line class="cota-fina" x1="730" y1="216" x2="750" y2="216"/>
  <line class="cota-fina" x1="730" y1="360" x2="750" y2="360"/>
  <text class="texto rotulo" transform="translate(768 320) rotate(-90)">Cume ? beiral = 1,80 m</text>

  <!-- Meia largura -->
  <line class="cota" x1="160" y1="190" x2="414" y2="190"/>
  <line class="cota-fina" x1="160" y1="182" x2="160" y2="198"/>
  <line class="cota-fina" x1="414" y1="182" x2="414" y2="198"/>
  <text class="texto rotulo-p" x="250" y="180">3,175 m (metade)</text>

  <!-- Comprimento da ?gua -->
  <line class="cota-fina" x1="280" y1="320" x2="360" y2="255"/>
  <text class="texto rotulo-p" x="200" y="300">?gua ? 3,65 m</text>

  <!-- Painel lateral: planta esquem?tica -->
  <rect x="780" y="90" width="170" height="280" fill="#fffdf8" stroke="#d5cbb8"/>
  <text class="texto rotulo" x="800" y="115">Planta (esquema)</text>
  <!-- 12 x 6.35 em escala reduzida: 12m=120px, 6.35m=63.5px -->
  <rect x="810" y="150" width="120" height="64" fill="#f3eee4" stroke="#222" stroke-width="1.5"/>
  <rect x="813" y="153" width="114" height="58" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="3 2"/>
  <line x1="870" y1="153" x2="870" y2="211" stroke="#6b4a2e" stroke-width="1.5"/>
  <text class="texto rotulo-p" x="840" y="240">12,00 m</text>
  <text class="texto rotulo-p" x="888" y="188" transform="rotate(90 888 188)">6,35 m</text>
  <text class="texto rotulo-p" x="800" y="265">Corte A?A</text>
  <line x1="805" y1="280" x2="905" y2="280" stroke="#c0392b" stroke-width="1.5"/>
  <text class="texto rotulo-p" x="800" y="300" fill="#c0392b">? vista deste corte</text>
  <text class="texto rotulo-p" x="800" y="340">Tipologia: duas ?guas</text>
  <text class="texto rotulo-p" x="800" y="356">(como o s?t?o actual)</text>

  <!-- Legenda -->
  <text class="texto nota" x="36" y="690">Escala do corte ? 1:12,5 ? estrutura esquem?tica (cumeeira, pontalete, caibros, cani?o) inspirada no s?t?o existente.</text>
</svg>
