<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <pattern id="telhaL" patternUnits="userSpaceOnUse" width="18" height="10">
      <path d="M0 8 Q4.5 2 9 8 Q13.5 2 18 8" fill="none" stroke="#a65332" stroke-width="1"/>
    </pattern>
    <pattern id="alv2" patternUnits="userSpaceOnUse" width="12" height="8">
      <rect width="12" height="8" fill="#f3eee4"/>
      <path d="M0 8 H12 M6 0 V8" stroke="#d8cfc0" stroke-width="0.8"/>
    </pattern>
    <style>
      .f{fill:#faf7f1}.t{font-family:"IBM Plex Sans",sans-serif;fill:#1a1a1a}
      .ti{font-size:20px;font-weight:700}.s{font-size:12px;fill:#555}.r{font-size:13px}
      .rp{font-size:11.5px;fill:#333}.c{stroke:#222;fill:none;stroke-width:1.15}
      .cf{stroke:#222;fill:none;stroke-width:0.9}.lo{stroke:#222;stroke-width:2;fill:none}
      .es{fill:#8a6240;stroke:#6b4a2e;stroke-width:1.5}
    </style>
  </defs>
  <rect class="f" width="1000" height="620"/>
  <text class="t ti" x="36" y="36">Peça 04  Corte longitudinal BB</text>
  <text class="t s" x="36" y="56">Comprimento 12,00 m · vista da cumeeira e pontaletes · altura do telhado 1,80 m</text>

  <!-- Escala 1m=55px. L=660, wall=16.5H17, h=99, beiral=14 -->
  <!-- y_beiral=320, y_cume=221, x0=120 -->
  <rect x="120" y="320" width="17" height="160" fill="url(#alv2)" stroke="#222" stroke-width="1.6"/>
  <rect x="763" y="320" width="17" height="160" fill="url(#alv2)" stroke="#222" stroke-width="1.6"/>

  <!-- Plano da cobertura (água vista de perfil = rectângulo inclinado visto de lado = faixa) -->
  <rect x="106" y="221" width="688" height="110" fill="url(#telhaL)" stroke="#222" stroke-width="1.6"/>
  <!-- Linha cumeeira no topo -->
  <rect class="es" x="137" y="221" width="626" height="12"/>

  <!-- Pontaletes -->
  <g class="es">
    <rect x="200" y="233" width="10" height="87"/>
    <rect x="332" y="233" width="10" height="87"/>
    <rect x="464" y="233" width="10" height="87"/>
    <rect x="596" y="233" width="10" height="87"/>
    <rect x="700" y="233" width="10" height="87"/>
  </g>

  <!-- Frechal / linha de beiral -->
  <rect class="es" x="120" y="314" width="660" height="10"/>

  <!-- Caibros em vista (pontos/secções) -->
  <g fill="#a07850">
    <circle cx="180" cy="300" r="3"/><circle cx="220" cy="300" r="3"/><circle cx="260" cy="300" r="3"/>
    <circle cx="300" cy="300" r="3"/><circle cx="340" cy="300" r="3"/><circle cx="380" cy="300" r="3"/>
    <circle cx="420" cy="300" r="3"/><circle cx="460" cy="300" r="3"/><circle cx="500" cy="300" r="3"/>
    <circle cx="540" cy="300" r="3"/><circle cx="580" cy="300" r="3"/><circle cx="620" cy="300" r="3"/>
    <circle cx="660" cy="300" r="3"/><circle cx="700" cy="300" r="3"/><circle cx="740" cy="300" r="3"/>
  </g>

  <text class="t r" x="400" y="210">Cumeeira</text>
  <text class="t rp" x="205" y="280">Pontaletes e H 2,40 m</text>
  <text class="t rp" x="100" y="310">Beiral</text>
  <text class="t rp" x="100" y="400">Parede topo</text>
  <text class="t rp" x="100" y="416">0,30 m</text>

  <line class="c" x1="120" y1="520" x2="780" y2="520"/>
  <line class="cf" x1="120" y1="512" x2="120" y2="528"/>
  <line class="cf" x1="780" y1="512" x2="780" y2="528"/>
  <text class="t r" x="400" y="542">12,00 m</text>

  <line class="c" x1="820" y1="221" x2="820" y2="320"/>
  <line class="cf" x1="812" y1="221" x2="828" y2="221"/>
  <line class="cf" x1="812" y1="320" x2="828" y2="320"/>
  <text class="t r" transform="translate(848 290) rotate(-90)">1,80 m</text>

  <!-- Espaçamento pontaletes -->
  <line class="c" x1="205" y1="180" x2="337" y2="180"/>
  <line class="cf" x1="205" y1="172" x2="205" y2="188"/>
  <line class="cf" x1="337" y1="172" x2="337" y2="188"/>
  <text class="t rp" x="240" y="170">H 2,40 m</text>

  <text class="t s" x="36" y="590">Corte pelo eixo da cumeeira. Em telhado de duas águas, a elevação longitudinal mostra a água como plano contínuo.</text>
</svg>
