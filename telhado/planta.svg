<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Planta do telhado — 12,00 × 6,35 m</title>
  <desc id="desc">Planta da cobertura de duas águas. Comprimento 12,00 m, largura 6,35 m, paredes 0,30 m, beiral ≈ 0,25 m, cumeeira centrada.</desc>

  <defs>
    <pattern id="agua-norte" patternUnits="userSpaceOnUse" width="18" height="10">
      <path d="M0 8 Q4.5 2 9 8 Q13.5 2 18 8" fill="none" stroke="#a65332" stroke-width="1"/>
    </pattern>
    <pattern id="agua-sul" patternUnits="userSpaceOnUse" width="18" height="10" patternTransform="rotate(180)">
      <path d="M0 8 Q4.5 2 9 8 Q13.5 2 18 8" fill="none" stroke="#94482c" stroke-width="1"/>
    </pattern>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8f4528"/>
    </marker>
    <style>
      .fundo { fill: #faf7f1; }
      .texto { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; fill: #1a1a1a; }
      .titulo { font-size: 22px; font-weight: 700; }
      .subtitulo { font-size: 13px; fill: #555; }
      .rotulo { font-size: 13px; }
      .rotulo-p { font-size: 11.5px; fill: #333; }
      .nota { font-size: 12px; fill: #555; }
      .cota { stroke: #222; stroke-width: 1.15; fill: none; }
      .cota-fina { stroke: #222; stroke-width: 0.9; fill: none; }
      .linha-parede { stroke: #222; stroke-width: 1.6; fill: none; }
      .cumeeira { stroke: #6b4a2e; stroke-width: 4; fill: none; }
      .corte { stroke: #b33a1a; stroke-width: 1.8; fill: none; stroke-dasharray: 7 4; }
    </style>
  </defs>

  <rect class="fundo" width="1000" height="740"/>

  <text class="texto titulo" x="36" y="40">Planta do telhado (cobertura)</text>
  <text class="texto subtitulo" x="36" y="62">Casa 12,00 × 6,35 m · paredes 0,30 m · duas águas · cumeeira centrada</text>

  <!-- Escala: 1 m = 50 px -->
  <!-- Exterior: 12,00 × 6,35 m = 600 × 317,5 px; origem NW paredes x=200 y=140 -->
  <!-- Beiral ≈ 0,25 m = 12,5 px; cumeeira y = 298,75 -->

  <rect x="187.5" y="127.5" width="625" height="342.5" fill="#f7f0e6" stroke="#222" stroke-width="2"/>

  <polygon points="187.5,127.5 812.5,127.5 812.5,298.75 187.5,298.75" fill="url(#agua-norte)" opacity="0.85"/>
  <polygon points="187.5,298.75 812.5,298.75 812.5,470 187.5,470" fill="url(#agua-sul)" opacity="0.9"/>

  <rect x="200" y="140" width="600" height="317.5" class="linha-parede" fill="none"/>
  <rect x="215" y="155" width="570" height="287.5" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="6 4"/>

  <line class="cumeeira" x1="187.5" y1="298.75" x2="812.5" y2="298.75" stroke-width="2.5" opacity="0.55"/>
  <line class="cumeeira" x1="200" y1="298.75" x2="800" y2="298.75"/>

  <rect x="187.5" y="127.5" width="625" height="342.5" fill="none" stroke="#222" stroke-width="2"/>

  <g stroke="#8a6240" stroke-width="1.4" opacity="0.55">
    <line x1="260" y1="140" x2="260" y2="457.5"/>
    <line x1="320" y1="140" x2="320" y2="457.5"/>
    <line x1="380" y1="140" x2="380" y2="457.5"/>
    <line x1="440" y1="140" x2="440" y2="457.5"/>
    <line x1="500" y1="140" x2="500" y2="457.5"/>
    <line x1="560" y1="140" x2="560" y2="457.5"/>
    <line x1="620" y1="140" x2="620" y2="457.5"/>
    <line x1="680" y1="140" x2="680" y2="457.5"/>
    <line x1="740" y1="140" x2="740" y2="457.5"/>
  </g>

  <line x1="500" y1="270" x2="500" y2="175" stroke="#8f4528" stroke-width="1.8" marker-end="url(#seta)"/>
  <line x1="500" y1="328" x2="500" y2="430" stroke="#8f4528" stroke-width="1.8" marker-end="url(#seta)"/>

  <text class="texto rotulo" x="360" y="210">Água norte</text>
  <text class="texto rotulo-p" x="360" y="226">Pendente ≈ 29,6°</text>
  <text class="texto rotulo" x="360" y="390">Água sul</text>
  <text class="texto rotulo-p" x="360" y="406">Comprimento inclinado ≈ 3,65 m</text>

  <text class="texto rotulo" x="620" y="290">Cumeeira</text>
  <text class="texto rotulo-p" x="620" y="306">eixo a 3,175 m</text>

  <text class="texto rotulo-p" x="820" y="145">Beiral</text>
  <text class="texto rotulo-p" x="820" y="161">≈ 0,25 m</text>

  <text class="texto rotulo-p" x="203" y="175">Parede</text>
  <text class="texto rotulo-p" x="203" y="191">0,30 m</text>

  <line class="corte" x1="500" y1="120" x2="500" y2="480"/>
  <text class="texto rotulo" fill="#b33a1a" x="508" y="118">Corte A–A</text>
  <text class="texto rotulo-p" fill="#b33a1a" x="508" y="492">vista lateral</text>

  <line class="cota" x1="200" y1="520" x2="800" y2="520"/>
  <line class="cota-fina" x1="200" y1="510" x2="200" y2="530"/>
  <line class="cota-fina" x1="800" y1="510" x2="800" y2="530"/>
  <text class="texto rotulo" x="430" y="545">Comprimento exterior = 12,00 m</text>

  <line class="cota" x1="187.5" y1="560" x2="812.5" y2="560"/>
  <line class="cota-fina" x1="187.5" y1="550" x2="187.5" y2="570"/>
  <line class="cota-fina" x1="812.5" y1="550" x2="812.5" y2="570"/>
  <text class="texto rotulo-p" x="410" y="582">Cobertura (com beiral) ≈ 12,50 m</text>

  <line class="cota" x1="120" y1="140" x2="120" y2="457.5"/>
  <line class="cota-fina" x1="110" y1="140" x2="130" y2="140"/>
  <line class="cota-fina" x1="110" y1="457.5" x2="130" y2="457.5"/>
  <text class="texto rotulo" transform="translate(98 360) rotate(-90)">Largura exterior = 6,35 m</text>

  <line class="cota" x1="155" y1="140" x2="155" y2="298.75"/>
  <line class="cota-fina" x1="145" y1="140" x2="165" y2="140"/>
  <line class="cota-fina" x1="145" y1="298.75" x2="165" y2="298.75"/>
  <text class="texto rotulo-p" transform="translate(142 250) rotate(-90)">3,175 m</text>

  <line class="cota" x1="870" y1="127.5" x2="870" y2="470"/>
  <line class="cota-fina" x1="860" y1="127.5" x2="880" y2="127.5"/>
  <line class="cota-fina" x1="860" y1="470" x2="880" y2="470"/>
  <text class="texto rotulo" transform="translate(898 360) rotate(-90)">Cobertura ≈ 6,85 m</text>

  <line class="cota" x1="187.5" y1="100" x2="200" y2="100"/>
  <line class="cota-fina" x1="187.5" y1="92" x2="187.5" y2="108"/>
  <line class="cota-fina" x1="200" y1="92" x2="200" y2="108"/>
  <text class="texto rotulo-p" x="175" y="90">0,25</text>

  <line class="cota" x1="200" y1="480" x2="215" y2="480"/>
  <line class="cota-fina" x1="200" y1="472" x2="200" y2="488"/>
  <line class="cota-fina" x1="215" y1="472" x2="215" y2="488"/>
  <text class="texto rotulo-p" x="198" y="500">0,30</text>

  <line class="cota" x1="215" y1="610" x2="785" y2="610"/>
  <line class="cota-fina" x1="215" y1="600" x2="215" y2="620"/>
  <line class="cota-fina" x1="785" y1="600" x2="785" y2="620"/>
  <text class="texto rotulo-p" x="430" y="632">Vão interior = 11,40 m</text>

  <g transform="translate(920, 80)">
    <circle cx="0" cy="0" r="28" fill="#fffdf8" stroke="#222" stroke-width="1.2"/>
    <line x1="0" y1="18" x2="0" y2="-18" stroke="#222" stroke-width="1.2"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#222" stroke-width="1.2"/>
    <polygon points="0,-22 -5,-8 5,-8" fill="#8f4528"/>
    <text class="texto rotulo-p" x="-4" y="-26" font-weight="700">N</text>
  </g>

  <g transform="translate(36, 660)">
    <text class="texto rotulo" x="0" y="0">Legenda</text>
    <line class="cumeeira" x1="0" y1="18" x2="40" y2="18"/>
    <text class="texto rotulo-p" x="50" y="22">Cumeeira</text>
    <line class="corte" x1="140" y1="18" x2="180" y2="18"/>
    <text class="texto rotulo-p" x="190" y="22">Corte A–A (vista lateral)</text>
    <line x1="360" y1="18" x2="400" y2="18" stroke="#8f4528" stroke-width="1.8" marker-end="url(#seta)"/>
    <text class="texto rotulo-p" x="410" y="22">Sentido da pendente</text>
    <rect x="560" y="10" width="28" height="16" fill="url(#agua-norte)" stroke="#222" stroke-width="0.8"/>
    <text class="texto rotulo-p" x="596" y="22">Telha (duas águas)</text>
  </g>

  <text class="texto nota" x="36" y="720">Escala gráfica ≈ 1:20 · tipologias e cotas alinhadas com o corte transversal (cume a 1,80 m acima do beiral).</text>
</svg>
